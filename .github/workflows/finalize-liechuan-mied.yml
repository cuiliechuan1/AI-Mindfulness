name: Finalize Liechuan MIED upload

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Liechuan/.upload/READY'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Rebuild and verify HTML file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Liechuan
          cat Liechuan/.upload/parts/part-*.b64 > /tmp/mied-upload.b64
          test "$(wc -c < /tmp/mied-upload.b64)" -eq 112692
          base64 --decode /tmp/mied-upload.b64 | bunzip2 > Liechuan/MIED-AI_Liechuan_7.31.html
          test "$(wc -c < Liechuan/MIED-AI_Liechuan_7.31.html)" -eq 406544
          echo '1dae9c994b4335374146de606a4a48f4c2095d5fe0b267c2264df616f299ba7b  Liechuan/MIED-AI_Liechuan_7.31.html' | sha256sum -c -
          rm -rf Liechuan/.upload
          rm -f .github/workflows/finalize-liechuan-mied.yml

      - name: Commit finalized upload
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Liechuan MIED community prototype'
          git push origin HEAD:${{ github.head_ref }}
