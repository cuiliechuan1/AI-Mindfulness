name: Finalize Liechuan MIED upload

on:
  push:
    branches:
      - main
    paths:
      - 'Liechuan/.upload/MIED-AI_Liechuan_7.31.html.bz2.b64'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode HTML file
        shell: bash
        run: |
          mkdir -p Liechuan
          base64 --decode Liechuan/.upload/MIED-AI_Liechuan_7.31.html.bz2.b64 | bunzip2 > Liechuan/MIED-AI_Liechuan_7.31.html
          rm -f Liechuan/.upload/MIED-AI_Liechuan_7.31.html.bz2.b64
          rmdir Liechuan/.upload 2>/dev/null || true
          rm -f .github/workflows/finalize-liechuan-mied.yml

      - name: Commit finalized upload
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Liechuan MIED community prototype'
          git push
